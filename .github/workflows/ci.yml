name: CI

# Runs on every push to main, every pull request, by hand, and as the first stage of a release.
# Pull requests use the plain `pull_request` trigger with read-only permissions and no secrets,
# so code from forks never sees anything sensitive.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff, shell syntax, version files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff==0.16.9"
      - name: Ruff (syntax errors and unused or undefined names; see ruff.toml)
        run: ruff check --output-format=github .
      - name: Launcher scripts are valid shell
        run: bash -n start_dashboard.sh && bash -n "Start Dashboard.command"
      - name: VERSION and CHANGELOG.md agree
        run: python scripts/release_tools.py check

  test:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false          # show every failing OS/Python, not just the first
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # The launchers promise Windows and macOS support, so test those once each.
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover tests -v

  smoke:
    name: Smoke test (forecast, database CLI, dashboard starts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the smoke test
        run: python scripts/smoke_test.py
